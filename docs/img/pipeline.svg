<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="From dump to kar.exe: lifter, C code, Clang and the runtime">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b2350"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#fff4f9"/>
  <g font-family="'Nunito','Segoe UI',sans-serif" fill="#2b2350">
    <text x="40" y="54" font-size="24" font-weight="800">From your dump to a running game</text>

    <g>
      <rect x="40" y="92" width="200" height="110" rx="20" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="140" y="138" text-anchor="middle" font-size="20" font-weight="800">Your dump</text>
      <text x="140" y="166" text-anchor="middle" font-size="15" fill="#4a4170">ExeFS (ARM64)</text>
      <text x="140" y="186" text-anchor="middle" font-size="15" fill="#4a4170">+ RomFS</text>
    </g>
    <line x1="244" y1="147" x2="312" y2="147" stroke="#2b2350" stroke-width="3" marker-end="url(#a)"/>
    <g>
      <rect x="316" y="92" width="200" height="110" rx="20" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="416" y="138" text-anchor="middle" font-size="20" font-weight="800">Lifter</text>
      <text x="416" y="166" text-anchor="middle" font-size="15" fill="#4a4170">ARM64 → C</text>
      <text x="416" y="186" text-anchor="middle" font-size="15" fill="#4a4170">recomp/gen.py</text>
    </g>
    <line x1="520" y1="147" x2="588" y2="147" stroke="#2b2350" stroke-width="3" marker-end="url(#a)"/>
    <g>
      <rect x="592" y="92" width="200" height="110" rx="20" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="692" y="138" text-anchor="middle" font-size="20" font-weight="800">Clang</text>
      <text x="692" y="166" text-anchor="middle" font-size="15" fill="#4a4170">C → x86-64</text>
      <text x="692" y="186" text-anchor="middle" font-size="15" fill="#4a4170">MSYS2 / llvm-mingw</text>
    </g>
    <line x1="796" y1="147" x2="864" y2="147" stroke="#2b2350" stroke-width="3" marker-end="url(#a)"/>
    <g>
      <rect x="868" y="80" width="292" height="134" rx="24" fill="#ee5a9b"/>
      <text x="1014" y="138" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">kar.exe</text>
      <text x="1014" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">native, no emulator</text>
    </g>

    <line x1="1014" y1="214" x2="1014" y2="262" stroke="#2b2350" stroke-width="3" marker-end="url(#a)"/>
    <text x="40" y="292" font-size="18" font-weight="800">The runtime provides what the Switch 2 would</text>
    <g font-size="15" font-weight="700">
      <rect x="40" y="312" width="210" height="80" rx="18" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="145" y="346" text-anchor="middle">Graphics</text>
      <text x="145" y="370" text-anchor="middle" font-weight="500" fill="#4a4170">NVN 2 → Vulkan</text>
      <rect x="270" y="312" width="210" height="80" rx="18" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="375" y="346" text-anchor="middle">Shader</text>
      <text x="375" y="370" text-anchor="middle" font-weight="500" fill="#4a4170">Ampere → SPIR-V</text>
      <rect x="500" y="312" width="210" height="80" rx="18" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="605" y="346" text-anchor="middle">Audio &amp; input</text>
      <text x="605" y="370" text-anchor="middle" font-weight="500" fill="#4a4170">SDL3</text>
      <rect x="730" y="312" width="210" height="80" rx="18" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="835" y="346" text-anchor="middle">System services</text>
      <text x="835" y="370" text-anchor="middle" font-weight="500" fill="#4a4170">files, time, memory</text>
      <rect x="960" y="312" width="200" height="80" rx="18" fill="#ffffff" stroke="#ecdcf0" stroke-width="3"/>
      <text x="1060" y="346" text-anchor="middle">PC extras</text>
      <text x="1060" y="370" text-anchor="middle" font-weight="500" fill="#4a4170">FSR, DLSS, Overlay</text>
    </g>
  </g>
</svg>
